name: "Maintenance: Cleanup Packages"

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly on Sunday at 3am
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Cleanup must be multi-arch aware: per-arch child manifests and cosign
      # signatures are "untagged" GHCR versions, so version-count cleanup
      # (actions/delete-package-versions) deletes them out from under tagged
      # release images even with delete-only-untagged-versions: true
      # (qalita-cli 2026-06-12, website:2.4.7 2026-07-07). This action resolves
      # manifest lists and referrers first and only deletes truly orphaned
      # versions; tagged releases (client deliverables served via
      # registry.qalita.io) are never touched.
      - name: Delete orphaned container versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          validate: true
          token: ${{ secrets.GITHUB_TOKEN }}
