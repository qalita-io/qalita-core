name: Build and push package to PyPI

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "*"
  workflow_dispatch:

# Minimal permissions following least privilege principle
permissions:
  contents: read
  actions: read

jobs:
  secrets-scan:
    name: Trufflehog - Secret Detection
    runs-on: ubuntu-latest  # TruffleHog action has issues with self-hosted runners
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for git history scanning
      - name: Run TruffleHog for secrets scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  test:
    name: Pytest - Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short

  publish:
    name: Publish to PyPI & GitHub Packages
    needs: [secrets-scan, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest  # setup-python doesn't support Python 3.13 on ARM64
    permissions:
      id-token: write  # Required for OIDC authentication with PyPI
      packages: write  # Required for publishing to GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Bump version from tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          sed -i "s/0.0.0-dev/${VERSION}/g" pyproject.toml
          sed -i "s/0.0.0-dev/${VERSION}/g" qalita_core/utils.py
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to GitHub Packages
        env:
          UV_PUBLISH_URL: https://pypi.pkg.github.com/${{ github.repository_owner }}
          UV_PUBLISH_USERNAME: ${{ github.actor }}
          UV_PUBLISH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv publish
      - name: Publish to GitHub Packages
        env:
          UV_PUBLISH_URL: https://pypi.pkg.github.com/${{ github.repository_owner }}
          UV_PUBLISH_USERNAME: ${{ github.actor }}
          UV_PUBLISH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv publish
