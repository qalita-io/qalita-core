version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(python)"
    labels:
      - "dependencies"
      - "python"
    # One grouped PR carries a single coherent uv.lock resolution. Merging
    # ungrouped lockfile PRs in sequence replays stale diffs onto a moved
    # base, which git merges without conflict but leaves inconsistent.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
