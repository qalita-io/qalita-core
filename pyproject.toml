[project]
name = "qalita_core"
version = "0.0.0-dev"
description = "QALITA Platform Core lib for common function used in pack"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: Unix",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Natural Language :: English"
]
dependencies = [
    "polars>=1.0.0",  # Primary data processing library for big data (100GB+)
    "sqlalchemy>=2.0.27",
    "pyarrow>=19.0.0",
    "openpyxl>=3.1.2",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.6.3",
    "boto3>=1.34.81",
    "google-cloud-storage>=2.16.0",
    "azure-storage-blob>=12.19.1",
    "hdfs>=2.7.3",
    "paramiko>=3.4.0",
    "oracledb>=2.5.0",
    # Data warehouse drivers
    "snowflake-sqlalchemy>=1.5.0",
    "sqlalchemy-bigquery>=1.9.0",
    "databricks-sql-connector>=3.0.0",
    "redshift-connector>=2.1.0",
    "clickhouse-sqlalchemy>=0.3.0",
    "duckdb>=0.10.0",
    "trino>=0.327.0",
    # Enterprise database drivers
    "teradatasqlalchemy>=17.20.0",
    "sqlalchemy-hana>=0.5.0",
    "hdbcli>=2.10.0",
    "cassandra-driver>=3.28.0",
    "elasticsearch>=8.0.0",
    "ibm-db-sa>=0.4.0",
    "pyathena>=3.0.0",
    "pymssql>=2.2.0",
]

[project.optional-dependencies]
# pandas is no longer on the hot path: nothing in qalita_core imports it at
# module level, and a pack that uses Polars must not pay for it. Install
# qalita_core[pandas] for the legacy DataFrame entry points
# (aggregation.add_df, pandas_sanitization) or for a pack wrapping a
# pandas-only third party.
pandas = [
    "pandas>=2.2.0",
]
dev = [
    "pandas>=2.2.0",
    "flake8>=3.8.1,<8.0",
    "pylint>=2.17.4",
    "black>=23.3.0",
    "pre-commit>=3.3.3",
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qalita_core"]
include = ["version.json"]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Memory-ceiling tests. They run a small dataset by default; set
    # QALITA_BIGDATA_ROWS to make them meaningful, and deselect with
    # `-m "not slow"` when you only want the semantic suite.
    "slow: exercises the streaming engine against a large generated dataset",
]
